name: News Pusher Continuous

on:
  workflow_dispatch: # Manual trigger / self-trigger from previous run

concurrency:
  group: news-pusher-single-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # Required to trigger workflow_dispatch via API

jobs:
  push-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5h 50min — leave buffer before GitHub's 6h hard limit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run continuous push loop (up to ~5h 45min)
        timeout-minutes: 345  # inner step limit, slightly less than job limit
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SUBSCRIPTIONS: ${{ vars.SUBSCRIPTIONS || 'The Economist, The New York Times, Financial Times' }}
          INTERVAL_SECONDS: '20'   # Push interval: 20 seconds (10~30s continuous news stream)
        run: |
          START_TIME=$(date +%s)
          # 5h 45min = 20700s  (leaves 5min for re-trigger + cleanup)
          MAX_DURATION=20700
          INTERVAL=${INTERVAL_SECONDS:-20}
          CYCLE=0

          echo "🚀 Starting continuous push loop"
          echo "   Interval: ${INTERVAL}s | Max duration: ${MAX_DURATION}s (~5h 45min)"

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START_TIME ))

            # Exit loop when we're close to the time limit
            if [ $ELAPSED -ge $MAX_DURATION ]; then
              echo "⏰ Approaching 6h limit (elapsed: ${ELAPSED}s). Stopping loop to relay to next run."
              break
            fi

            CYCLE=$(( CYCLE + 1 ))
            REMAINING=$(( MAX_DURATION - ELAPSED ))
            echo ""
            echo "════════════════════════════════════════"
            echo "  🔄 Cycle #${CYCLE} | Elapsed: ${ELAPSED}s | Remaining: ~${REMAINING}s"
            echo "════════════════════════════════════════"

            # Pull latest history from remote to keep rotation in sync
            git fetch origin main --quiet 2>/dev/null || true
            git checkout origin/main -- history.json 2>/dev/null || true

            # Run push job (handles new articles + continuous carousel replay)
            node scripts/github-push.mjs || echo "  ⚠️ Push script encountered an error, will retry next cycle"

            # Check if brand new article was pushed
            NEW_SENT=0
            if [ -f .last_push_status.json ]; then
              NEW_SENT=$(jq -r '.newSent // 0' .last_push_status.json 2>/dev/null || echo 0)
            fi

            # Commit & sync history back to GitHub: immediately for new articles, or every 10 cycles (~3 min) for carousel
            git add history.json
            if [ -n "$(git status --porcelain history.json)" ]; then
              if [ "$NEW_SENT" -gt 0 ] || [ $(( CYCLE % 10 )) -eq 0 ]; then
                git commit -m "update: sync push history [skip ci]" || true

                # Rebase in case remote advanced
                git fetch origin main --quiet 2>/dev/null || true
                git rebase origin/main --quiet 2>/dev/null || {
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main --quiet 2>/dev/null || true
                  git reset --hard origin/main --quiet 2>/dev/null || true
                }
                git push origin main --quiet && echo "  ☁️ History synced to GitHub" || echo "  ⚠️ Push skipped (conflict resolved next cycle)"
              else
                echo "  ℹ️ Carousel history updated locally (batch sync scheduled in next interval)"
              fi
            fi

            # Sleep until next cycle (20 seconds)
            echo "  💤 Sleeping ${INTERVAL}s until next news check..."
            sleep $INTERVAL
          done

          # Final sync before relay
          git add history.json
          if [ -n "$(git status --porcelain history.json)" ]; then
            git commit -m "update: sync push history before relay [skip ci]" || true
            git push origin main --quiet || true
          fi

          echo ""
          echo "✅ 6-hour relay loop completed after $CYCLE cycles."

      - name: Auto re-trigger next run (seamless relay)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking for any existing active/queued workflow runs..."
          ACTIVE_RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/push.yml/runs?per_page=20" \
            | jq --arg my_id "${{ github.run_id }}" '[.workflow_runs[]? | select((.id | tostring) != $my_id and (.status == "in_progress" or .status == "queued" or .status == "waiting"))] | length')

          if [ -n "$ACTIVE_RUNS" ] && [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "⚠️ Found $ACTIVE_RUNS other active/queued run(s). Skipping auto-trigger to avoid duplicate runners."
            exit 0
          fi

          echo "🔁 Triggering next continuous run via workflow_dispatch..."
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/push.yml/dispatches" \
            -d '{"ref":"main"}' && echo "✅ Next run triggered successfully." || echo "⚠️ Failed to trigger next run."

