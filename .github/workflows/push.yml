name: News Pusher Cron

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (GitHub limits free tier to 5-15 mins min but 30 is safer)
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for committing back

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Push Job
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUBSCRIPTIONS: ${{ vars.SUBSCRIPTIONS || 'The Economist, The New York Times, Financial Times (not cn subdomain)' }}
        run: node scripts/github-push.mjs

      - name: Commit & Push History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            let local = [];
            try { local = JSON.parse(fs.readFileSync("history.json", "utf8")); } catch {}
            let remote = [];
            try {
              const remoteStr = execSync("git show origin/main:history.json", { encoding: "utf8" });
              remote = JSON.parse(remoteStr);
            } catch {}
            const merged = [...remote];
            const seen = new Set(merged.map(x => typeof x === "string" ? x : x.id));
            for (const item of local) {
              const id = typeof item === "string" ? item : item.id;
              if (!seen.has(id)) {
                merged.push(item);
                seen.add(id);
              }
            }
            execSync("git reset --hard origin/main");
            fs.writeFileSync("history.json", JSON.stringify(merged.slice(-1500), null, 2));
          '
          git add history.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "update: sync push history [skip ci]"
            git push origin main
          fi
