name: News Pusher Continuous

on:
  schedule:
    - cron: '*/30 * * * *' # Watchdog: auto-restart loop if runner ever terminates
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push.yml'
  workflow_dispatch: # Manual trigger / self-trigger from previous run

concurrency:
  group: news-pusher-single-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # Required to trigger workflow_dispatch via API

jobs:
  push-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5h 50min buffer before GitHub's 6h hard limit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run continuous push loop (~5h)
        timeout-minutes: 320  # Safe margin before job timeout
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUBSCRIPTIONS: ${{ vars.SUBSCRIPTIONS || 'The Economist, The New York Times, Financial Times' }}
          INTERVAL_SECONDS: '20'   # Push interval: 20 seconds (10~30s continuous news stream)
        run: |
          START_TIME=$(date +%s)
          # 5h = 18000s (leaves 20+ min for final sync, re-trigger relay, and buffer before step limit)
          MAX_DURATION=18000
          INTERVAL=${INTERVAL_SECONDS:-20}
          CYCLE=0

          echo "🚀 Starting continuous push loop"
          echo "   Interval: ${INTERVAL}s | Max duration: ${MAX_DURATION}s (5h)"

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START_TIME ))

            # Exit loop when we've reached the planned 5h duration
            if [ $ELAPSED -ge $MAX_DURATION ]; then
              echo "⏰ Planned 5-hour duration reached (elapsed: ${ELAPSED}s). Exiting loop to relay cleanly to next run."
              break
            fi

            CYCLE=$(( CYCLE + 1 ))
            REMAINING=$(( MAX_DURATION - ELAPSED ))
            echo ""
            echo "════════════════════════════════════════"
            echo "  🔄 Cycle #${CYCLE} | Elapsed: ${ELAPSED}s | Remaining: ~${REMAINING}s"
            echo "════════════════════════════════════════"

            # Pull latest subscriptions.json and scripts if updated remotely
            git fetch origin main --quiet 2>/dev/null || true
            git checkout origin/main -- subscriptions.json scripts/ 2>/dev/null || true

            # Run push job (handles new articles + continuous carousel replay)
            # Local history.json persists across cycles in this runner instance
            node scripts/github-push.mjs || echo "  ⚠️ Push script encountered an error, will retry next cycle"

            # Check if brand new article was pushed
            NEW_SENT=0
            if [ -f .last_push_status.json ]; then
              NEW_SENT=$(jq -r '.newSent // 0' .last_push_status.json 2>/dev/null || echo 0)
            fi

            # Sync history.json to GitHub:
            # 1. Immediately if new breaking news was pushed (so public dashboard reflects it)
            # 2. Or periodically every 30 cycles (~10 min) for carousel rotation updates
            # This prevents overwhelming GitHub with 700+ pushes/Pages builds while preserving state.
            git add history.json
            if [ -n "$(git status --porcelain history.json)" ]; then
              if [ "$NEW_SENT" -gt 0 ] || [ $(( CYCLE % 30 )) -eq 0 ]; then
                git commit -m "update: sync push history [skip ci]" || true

                # Rebase in case remote advanced
                git fetch origin main --quiet 2>/dev/null || true
                git rebase origin/main --quiet 2>/dev/null || {
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main --quiet 2>/dev/null || true
                  git reset --hard origin/main --quiet 2>/dev/null || true
                }
                git push origin main --quiet && echo "  ☁️ History synced to GitHub" || echo "  ⚠️ Push skipped (will retry next interval)"
              fi
            fi

            # Sleep until next cycle (20 seconds)
            echo "  💤 Sleeping ${INTERVAL}s until next news check..."
            sleep $INTERVAL
          done

          # Final sync before relay
          git add history.json
          if [ -n "$(git status --porcelain history.json)" ]; then
            git commit -m "update: sync push history before relay [skip ci]" || true
            git fetch origin main --quiet 2>/dev/null || true
            git rebase origin/main --quiet 2>/dev/null || {
              git rebase --abort 2>/dev/null || true
              git fetch origin main --quiet 2>/dev/null || true
              git reset --hard origin/main --quiet 2>/dev/null || true
            }
            git push origin main --quiet || true
          fi

          echo ""
          echo "✅ 5-hour continuous run completed after $CYCLE cycles."

      - name: Auto re-trigger next run (seamless relay)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking for any existing active/queued workflow runs..."
          ACTIVE_RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/push.yml/runs?per_page=20" \
            | jq --arg my_id "${{ github.run_id }}" '[.workflow_runs[]? | select((.id | tostring) != $my_id and (.status == "in_progress" or .status == "queued" or .status == "waiting"))] | length')

          if [ -n "$ACTIVE_RUNS" ] && [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "⚠️ Found $ACTIVE_RUNS other active/queued run(s). Skipping auto-trigger to avoid duplicate runners."
            exit 0
          fi

          echo "🔁 Triggering next continuous run via workflow_dispatch..."
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/push.yml/dispatches" \
            -d '{"ref":"main"}' && echo "✅ Next run triggered successfully." || echo "⚠️ Failed to trigger next run."
